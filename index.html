.card{width:100%;max-width:560px;margin:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 3px 16px rgba(0,0,0,.12)}

button,.mailButton{display:block;width:100%;min-height:58px;height:auto;border:0;border-radius:14px;background:#1769d1;color:#fff;font-size:18px;font-weight:800;margin-top:20px;padding:14px 12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.secondary{background:#68737d;margin-top:10px}
#status{text-align:center;font-weight:700;margin-top:12px;min-height:22px;line-height:1.35}
.note{font-size:12px;color:#697681;text-align:center;line-height:1.4;margin-top:12px}

<div id="status"></div>
<div class="note">
Offline nutzbar. Die Eingaben werden automatisch auf diesem Gerät gespeichert.<br>
Beim Tippen wird die auf dem Gerät eingerichtete E-Mail-App mit einer fertigen E-Mail geöffnet.

<script>
const KEY = "materialumbuchung_offline_v2";
const recipient = "BAT-ServiceLogistik-Ost-IN";
const ids = ["von", "nach", "material1", "menge1", "material2", "menge2", "material3", "menge3", "material4", "menge4", "material5", "menge5"];

function el(id) {
  return document.getElementById(id);
}

function speichern() {
  try {
    const data = {};
    ids.forEach(id => data[id] = el(id).value);
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("Speichern nicht möglich:", e);
  }
}

function laden() {
  try {
    const data = JSON.parse(localStorage.getItem(KEY) || "{}");
    ids.forEach(id => {
      if (data[id] !== undefined) el(id).value = data[id];
    });
  } catch (e) {
    console.warn("Laden nicht möglich:", e);
  }
}

function setzenStatus(text, fehler = false) {
  const status = el("status");
  status.textContent = text;
  status.style.color = fehler ? "#c62828" : "";
}

function senden() {
  const von = el("von").value.trim();
  const nach = el("nach").value.trim();

  if (!von || !nach) {
    setzenStatus("Bitte Von Lager und Nach Lager auswählen.", true);
    return false;
  }

  if (von === nach) {
    setzenStatus("Von Lager und Nach Lager dürfen nicht identisch sein.", true);
    return false;
  }

  const positionen = [];
  for (let i = 1; i <= 5; i++) {
    const material = el("material" + i).value.trim();
    const menge = el("menge" + i).value.trim();

    if (material && !menge) {
      setzenStatus("Bitte für Material " + i + " auch eine Menge eingeben.", true);
      return false;
    }
    if (!material && menge) {
      setzenStatus("Bitte für Menge " + i + " auch eine Materialnummer eingeben.", true);
      return false;
    }

    if (material && menge) {
      const mengeNummer = Number(menge.replace(",", "."));
      if (!Number.isFinite(mengeNummer) || mengeNummer <= 0) {
        setzenStatus("Bitte eine gültige Menge bei Material " + i + " eingeben.", true);
        return false;
      }
      positionen.push({ material, menge });
    }
  }

  if (positionen.length === 0) {
    setzenStatus("Bitte mindestens ein Material mit Menge eingeben.", true);
    return false;
  }

  speichern();

  let bodyText =
    "Guten Tag,\n\n" +
    "ich bitte um Durchführung der folgenden Materialumbuchung:\n\n" +
    "━━━━━━━━━━━━━━━━━━━━\n" +
    "MATERIALUMBUCHUNG\n" +
    "━━━━━━━━━━━━━━━━━━━━\n\n" +
    "Von Lager:  " + von + "\n" +
    "Nach Lager: " + nach + "\n\n" +
    "Materialien:\n\n";

  positionen.forEach((p, index) => {
    bodyText +=
      (index + 1) + ". Materialnummer: " + p.material + "\n" +
      "   Menge: " + p.menge + "\n\n";
  });

  bodyText +=
    "━━━━━━━━━━━━━━━━━━━━\n\n" +
    "Vielen Dank für die Bearbeitung.\n\n" +
    "Freundliche Grüße";

  const subject = encodeURIComponent("Materialumbuchung – " + positionen.map(p => p.material).join(", "));

  el("emailButton").href =
    "mailto:" + recipient +
    "?subject=" + subject +
    "&body=" + encodeURIComponent(bodyText);

  return true;
}

el("emailButton").addEventListener("click", function(event) {
  if (!senden()) {
    event.preventDefault();
  }
});

function loeschen() {
  try {
    localStorage.removeItem(KEY);
  } catch (e) {
    console.warn("Speicher konnte nicht gelöscht werden:", e);
  }

  ids.forEach(id => el(id).value = "");
  setzenStatus("Eingaben gelöscht.");
  el("von").focus();
}

ids.forEach(id => {
  el(id).addEventListener("input", speichern);
  el(id).addEventListener("change", speichern);
});

document.addEventListener("keydown", event => {
  if (event.key === "Enter" && event.target.matches("input")) {
    event.preventDefault();
  }
});

laden();
</script>
